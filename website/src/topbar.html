<header class="topbar">
  <div class="brand">
    <div class="club">
      <img src="assets/francor-logo.png" width="105" height="120" alt="">
      <span>FRANCOR<b>e.&nbsp;V.</b></span>
    </div>
    <span class="bsep" aria-hidden="true"></span>
    <div class="btitle">
      <div class="bline">
        <span class="flag">Pit&nbsp;Lane</span>
        <h1>Maqueen Grand Prix</h1>
      </div>
      <span class="sub">micro:bit&nbsp;V2 &middot; Maqueen&nbsp;Plus&nbsp;V3</span>
    </div>
  </div>
  <div class="tbgroup">
    <div class="teamfield">
      <label for="team">Team</label>
      <input id="team" type="text" placeholder="Name eintippen" maxlength="22" autocomplete="off">
    </div>
    <div class="score"><b id="ptsval">0</b><span>Punkte</span></div>
    <div class="timer" id="timer"><span id="tval">90:00</span><button id="tbtn" type="button">Start</button></div>
    <button class="ghost" id="coachbtn" type="button">Für Betreuer</button>
    <button class="ghost" id="resetbtn" type="button">Neues Team</button>
  </div>
</header>
